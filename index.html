<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trusi.fun</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; color: #333; }
        
        .header-panel { display: flex; justify-content: space-between; align-items: start; max-width: 600px; margin: 0 auto 20px auto; }
        .icon-btn { width: 50px; height: 50px; cursor: pointer; }
        .share-label { font-size: 11px; color: #666; margin-top: 5px; }

        h1 { font-size: 24px; margin: 10px 0; }
        .logo-main { max-width: 300px; width: 100%; margin: 20px 0; border-radius: 15px; }
        
        .links-list { list-style: none; padding: 0; }
        .link-item { margin: 15px 0; }
        .link-item a { text-decoration: none; color: #0088cc; font-size: 20px; font-weight: bold; }
        
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-top: 30px; }
        .gallery-item { cursor: pointer; text-decoration: none; color: inherit; }
        .gallery-item img { width: 100%; border-radius: 10px; }
    </style>
</head>
<body>

    <!-- Верхня панель -->
    <div class="header-panel">
        <!-- Кнопка 1 -->
        <div style="text-align: center;">
            <button onclick="shareSite()" style="border:none; background:none; cursor:pointer; padding:0;">
                <img src="logo.png" class="icon-btn" alt="Share">
            </button>
            <div class="share-label">Поділитися</div>
        </div>

        <!-- Кнопка 2 (тепер теж для шерингу) -->
        <div style="text-align: center;">
            <button onclick="shareSite()" style="border:none; background:none; cursor:pointer; padding:0;">
                <img src="qr-code.png" class="icon-btn" alt="Share">
            </button>
            <div class="share-label">Поділитися</div>
        </div>
    </div>

    <h1>Вітаю на trusi.fun!</h1>
    
    <img src="logo.png" alt="Логотип" class="logo-main">

    <p>Тут ви знайдете найцікавіше:</p>

    <ul class="links-list">
        <li class="link-item"><a href="https://t.me/trusifun">Мій Telegram канал</a></li>
        <li class="link-item"><a href="mailto:trusifun@gmail.com">Написати мені</a></li>
    </ul>

    <div class="gallery">
        <a href="https://t.me/trusifun" class="gallery-item">
            <img src="photo1.jpg" alt="Фото">
            <p>Підпис</p>
        </a>
    </div>

    <script>
        function shareSite() {
            if (navigator.share) {
                navigator.share({
                    title: 'Trusi.fun',
                    text: 'Цікавий контент на trusi.fun!',
                    url: 'https://trusi.fun'
                }).catch(err => console.error(err));
            } else {
                navigator.clipboard.writeText("https://trusi.fun");
                alert("Посилання скопійовано!");
            }
        }
    </script>

</body>
</html>

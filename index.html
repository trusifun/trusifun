<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trusi.fun</title>
    <!-- Іконка сайту -->
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; color: #333; }
        
        .header-panel { display: flex; justify-content: space-between; align-items: center; max-width: 600px; margin: 0 auto 20px auto; }
        .icon-btn { width: 50px; height: 50px; cursor: pointer; }

        h1 { font-size: 24px; margin: 10px 0; }
        .logo-main { max-width: 300px; width: 100%; margin: 20px 0; border-radius: 15px; }
        
        .links-list { list-style: none; padding: 0; }
        .link-item { margin: 15px 0; }
        .link-item a { text-decoration: none; color: #0088cc; font-size: 20px; font-weight: bold; }
        
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-top: 30px; }
        .gallery-item { cursor: pointer; text-decoration: none; color: inherit; }
        .gallery-item img { width: 100%; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="header-panel">
        <a href="https://t.me/share/url?url=https://trusi.fun"><img src="logo.png" class="icon-btn" alt="Share"></a>
        <a href="https://t.me/trusifun"><img src="qr-code.png" class="icon-btn" alt="QR"></a>
    </div>

    <h1>Вітаю на trusi.fun!</h1>
    
    <img src="logo.png" alt="Логотип" class="logo-main">

    <p>Тут ви знайдете найцікавіше:</p>

    <ul class="links-list">
        <li class="link-item"><a href="https://t.me/trusifun">Мій Telegram канал</a></li>
        <li class="link-item"><a href="mailto:trusifun@gmail.com">Написати мені</a></li>
    </ul>

    <div class="gallery">
        <a href="https://t.me/trusifun" class="gallery-item">
            <img src="photo1.jpg" alt="Фото">
            <p>Підпис</p>
        </a>
    </div>

</body>
</html>
